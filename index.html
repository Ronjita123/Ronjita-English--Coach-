<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ronjita English Coach</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <div class="header">
    <small>✨ Creator: Ronjita</small>
    <h1>Ronjita English Coach</h1>
    <div class="score-board">🏆 Total Points: <span id="totalPoints">0</span></div>
  </div>

  <!-- TABS -->
  <div class="tabs">
    <button class="tab active" onclick="switchTab('vocabSection', this)">Vocabulary & Practice</button>
    <button class="tab" onclick="switchTab('statsSection', this)">My Progress</button>
  </div>

  <!-- VOCABULARY & PRACTICE SECTION -->
  <div id="vocabSection" class="section active">
    <h3>📚 Today's Vocabulary List (25+ Words)</h3>
    <div id="vocabularyList" class="vocab-container"></div>

    <div class="practice-box">
      <h3>✍️ Sentence Practice Zone</h3>
      <p>যেকোনো শব্দ দিয়ে নিজে বাক্য তৈরি করুন এবং পয়েন্ট অর্জন করুন:</p>
      
      <div class="input-group">
        <textarea id="sentenceInput" rows="3" placeholder="Click mic to speak or type your sentence..."></textarea>
        <button id="voiceBtn" onclick="startVoiceInput()" class="mic-btn">🎙️ Voice</button>
      </div>

      <button onclick="checkAndAddSentence()" class="primary">Send & Check Sentence</button>
      <div id="feedbackResult"></div>
    </div>
  </div>

  <!-- PROGRESS SECTION -->
  <div id="statsSection" class="section">
    <h3>📊 Your Daily Progress</h3>
    <div class="card">
      <p><strong>Total Practice Score:</strong> <span id="statPoints">0</span> Points</p>
      <p><strong>Sentences Created:</strong> <span id="statSentences">0</span></p>
      <p><strong>Status:</strong> <span id="userLevel">Beginner Learner</span></p>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
